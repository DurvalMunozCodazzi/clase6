<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tirada de Tarot — Pasado, Presente y Futuro</title>
<style>
  #tarotApp, #tarotApp * { box-sizing: border-box; }
  #tarotApp [hidden] { display: none !important; }
  #tarotApp {
    --bg-deep: #120a1f;
    --bg-panel: #1c1230;
    --gold: #d4af37;
    --gold-soft: #f1d98b;
    --purple: #6b3fa0;
    --text: #f3ecff;
    --text-dim: #b9a9d9;
    --mayor-a: #4a2a7a; --mayor-b: #8a4fd6;
    --bastos-a: #7a2e0e; --bastos-b: #d9622b;
    --copas-a: #0e4a6b; --copas-b: #2fa8d9;
    --espadas-a: #3a3f4a; --espadas-b: #9aa5b5;
    --oros-a: #5a4a0e; --oros-b: #d4af37;
    max-width: 880px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
    background: radial-gradient(circle at 50% 0%, var(--bg-panel), var(--bg-deep) 70%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    border-radius: 1rem;
  }
  #tarotApp h1, #tarotApp h2, #tarotApp h3 { font-family: Georgia, 'Times New Roman', serif; margin: 0 0 0.5rem; }
  #tarotApp .tarot-header { text-align: center; margin-bottom: 1.5rem; }
  #tarotApp .tarot-header h1 { color: var(--gold-soft); font-size: 1.8rem; }
  #tarotApp .subtitle { color: var(--text-dim); margin: 0; }

  #tarotApp .step-intro { color: var(--text-dim); margin: 0 0 1rem; }
  #tarotApp .link-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 0.8rem; text-decoration: underline; padding: 0; margin-bottom: 0.8rem;
  }
  #tarotApp .link-btn:hover { color: var(--gold-soft); }

  #tarotApp .mode-step { max-width: 580px; margin: 0 auto; text-align: center; }
  #tarotApp .mode-options { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  #tarotApp .mode-card {
    background: rgba(255,255,255,0.04); border: 1px solid var(--purple); border-radius: 0.8rem;
    padding: 1.2rem; cursor: pointer; text-align: left; color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease; font: inherit;
  }
  #tarotApp .mode-card:hover { transform: translateY(-3px); border-color: var(--gold); }
  #tarotApp .mode-icon { font-size: 1.8rem; display: block; margin-bottom: 0.5rem; }
  #tarotApp .mode-card h3 { color: var(--gold-soft); font-size: 1.05rem; }
  #tarotApp .mode-card p { color: var(--text-dim); font-size: 0.82rem; margin: 0; line-height: 1.4; }

  #tarotApp .question-step { max-width: 480px; margin: 0 auto; text-align: center; }
  #tarotApp label { display: block; margin-bottom: 0.5rem; color: var(--text-dim); }
  #tarotApp textarea {
    width: 100%; border-radius: 0.6rem; border: 1px solid var(--purple);
    background: rgba(255,255,255,0.05); color: var(--text); padding: 0.7rem;
    font-size: 1rem; resize: vertical; margin-bottom: 1rem;
  }
  #tarotApp .btn-primary, #tarotApp .btn-secondary {
    font-size: 1rem; padding: 0.7rem 1.4rem; border-radius: 2rem; border: none;
    cursor: pointer; font-weight: 600; transition: transform 0.15s ease, opacity 0.15s ease;
  }
  #tarotApp .btn-primary { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #241533; }
  #tarotApp .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--purple); }
  #tarotApp .btn-primary:hover, #tarotApp .btn-secondary:hover { transform: translateY(-2px); }
  #tarotApp .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #tarotApp .shuffle-step { max-width: 400px; margin: 0 auto; text-align: center; }
  #tarotApp .shuffle-deck { position: relative; width: 130px; height: 195px; margin: 1.2rem auto 1.6rem; }
  #tarotApp .deck-card {
    position: absolute; inset: 0; border-radius: 0.6rem; border: 1px solid var(--purple);
    background: repeating-linear-gradient(135deg, #2a1a45, #2a1a45 8px, #241338 8px, #241338 16px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  #tarotApp .deck-card:nth-child(2) { transform: translate(3px, -3px); }
  #tarotApp .deck-card:nth-child(3) { transform: translate(6px, -6px); }
  #tarotApp .deck-card:nth-child(4) { transform: translate(9px, -9px); }
  #tarotApp .deck-card:nth-child(5) { transform: translate(12px, -12px); }
  @keyframes shuffleMove {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-16px, -8px) rotate(-9deg); }
    50% { transform: translate(14px, 4px) rotate(7deg); }
    75% { transform: translate(-8px, 6px) rotate(-4deg); }
  }
  #tarotApp .shuffle-deck.is-shuffling .deck-card { animation: shuffleMove 0.9s ease-in-out; }
  #tarotApp .shuffle-deck.is-shuffling .deck-card:nth-child(1) { animation-delay: 0s; }
  #tarotApp .shuffle-deck.is-shuffling .deck-card:nth-child(2) { animation-delay: 0.06s; }
  #tarotApp .shuffle-deck.is-shuffling .deck-card:nth-child(3) { animation-delay: 0.12s; }
  #tarotApp .shuffle-deck.is-shuffling .deck-card:nth-child(4) { animation-delay: 0.18s; }
  #tarotApp .shuffle-deck.is-shuffling .deck-card:nth-child(5) { animation-delay: 0.24s; }
  @media (prefers-reduced-motion: reduce) {
    #tarotApp .shuffle-deck.is-shuffling .deck-card { animation: none; }
  }

  #tarotApp .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 2rem 0; }
  #tarotApp .slot { background: rgba(255,255,255,0.04); border: 1px dashed var(--purple); border-radius: 0.8rem; padding: 0.8rem; text-align: center; }
  #tarotApp .slot-label { color: var(--gold-soft); font-weight: 600; margin-bottom: 0.6rem; display: block; }
  #tarotApp .slot-placeholder {
    width: 100%; aspect-ratio: 2 / 3; border-radius: 0.6rem; margin: 0 auto 0.6rem;
    background: repeating-linear-gradient(135deg, #2a1a45, #2a1a45 8px, #241338 8px, #241338 16px);
    border: 1px solid var(--purple); display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; color: var(--text-dim);
  }
  #tarotApp .slot-name { font-size: 0.85rem; color: var(--text-dim); min-height: 1.2em; margin-top: 0.3rem; }

  #tarotApp .card-face { width: 100%; aspect-ratio: 2 / 3; margin: 0 auto; }
  #tarotApp .card-inner {
    position: relative; width: 100%; height: 100%; border-radius: 0.6rem; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.25); transition: transform 0.4s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  #tarotApp .card-inner.is-reversed { transform: rotate(180deg); }
  #tarotApp .arcana-mayor .card-inner { background: linear-gradient(160deg, var(--mayor-a), var(--mayor-b)); }
  #tarotApp .suit-bastos .card-inner { background: linear-gradient(160deg, var(--bastos-a), var(--bastos-b)); }
  #tarotApp .suit-copas .card-inner { background: linear-gradient(160deg, var(--copas-a), var(--copas-b)); }
  #tarotApp .suit-espadas .card-inner { background: linear-gradient(160deg, var(--espadas-a), var(--espadas-b)); }
  #tarotApp .suit-oros .card-inner { background: linear-gradient(160deg, var(--oros-a), var(--oros-b)); }
  #tarotApp .card-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #tarotApp .card-symbolic {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; padding: 0.4rem; text-align: center;
  }
  #tarotApp .card-tag { font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.85); align-self: flex-start; }
  #tarotApp .card-icon { font-size: 1.8rem; }
  #tarotApp .card-name-mini { font-size: 0.72rem; font-weight: 600; line-height: 1.15; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  #tarotApp .reading { background: rgba(255,255,255,0.04); border-radius: 0.8rem; padding: 1.2rem; margin-top: 1.5rem; }
  #tarotApp .reading-question { font-style: italic; color: var(--gold-soft); }
  #tarotApp .reading-line { margin: 1rem 0; padding-left: 0.8rem; border-left: 3px solid var(--purple); }
  #tarotApp .reading-line h3 { color: var(--gold-soft); font-size: 1.05rem; }
  #tarotApp .reading-synthesis { margin-top: 1.2rem; padding: 1rem; background: rgba(212,175,55,0.08); border-radius: 0.6rem; border: 1px solid rgba(212,175,55,0.3); }
  #tarotApp .footer-actions { text-align: center; margin-top: 1rem; display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }

  #tarotApp .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,2,15,0.85); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem;
  }
  #tarotApp .modal {
    background: var(--bg-panel); border: 1px solid var(--purple); border-radius: 1rem;
    width: 100%; max-width: 640px; max-height: 88vh; display: flex; flex-direction: column;
    padding: 1rem; color: var(--text);
  }
  #tarotApp .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
  #tarotApp .modal-close { background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; }
  #tarotApp .card-search-input {
    width: 100%; padding: 0.55rem 0.8rem; border-radius: 0.5rem; border: 1px solid var(--purple);
    background: rgba(255,255,255,0.05); color: var(--text); margin-bottom: 0.6rem; font-size: 0.9rem;
  }
  #tarotApp .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px;
    overflow-y: auto; padding: 0.3rem; flex: 1;
  }
  #tarotApp .card-grid.card-grid--browse { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  #tarotApp .card-mini-btn {
    aspect-ratio: 2 / 3; border-radius: 0.3rem; border: 1px solid var(--purple); cursor: pointer;
    background: repeating-linear-gradient(135deg, #2a1a45, #2a1a45 6px, #241338 6px, #241338 12px);
    transition: transform 0.15s ease;
  }
  #tarotApp .card-mini-btn:hover { transform: scale(1.08); border-color: var(--gold); }
  #tarotApp .card-search-btn {
    display: block; width: 100%; padding: 0; border: none; background: transparent;
    cursor: pointer; border-radius: 0.4rem; transition: transform 0.15s ease;
  }
  #tarotApp .card-search-btn:hover { transform: scale(1.06); }
  #tarotApp .card-search-empty { color: var(--text-dim); text-align: center; padding: 2rem 1rem; grid-column: 1 / -1; }
  #tarotApp .reveal-panel {
    display: flex; gap: 1rem; align-items: center; margin-top: 1rem; padding-top: 1rem;
    border-top: 1px solid rgba(255,255,255,0.15); animation: flipReveal 0.35s ease;
  }
  @keyframes flipReveal { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  #tarotApp .reveal-card { width: 110px; flex-shrink: 0; }
  #tarotApp .reveal-info { flex: 1; }
  #tarotApp .reveal-info h3 { color: var(--gold-soft); margin-bottom: 0.3rem; }
  #tarotApp .reveal-info p { color: var(--text-dim); font-size: 0.9rem; margin: 0 0 0.7rem; }
  #tarotApp .orientation-toggle { display: flex; gap: 0.5rem; margin-bottom: 0.7rem; }
  #tarotApp .orientation-btn {
    flex: 1; padding: 0.4rem 0.6rem; border-radius: 0.5rem; border: 1px solid var(--purple);
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 0.82rem; font-weight: 600;
  }
  #tarotApp .orientation-btn.active { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #241533; border-color: transparent; }
  #tarotApp .reveal-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  @media (max-width: 560px) {
    #tarotApp .mode-options { grid-template-columns: 1fr; }
    #tarotApp .spread { grid-template-columns: 1fr; }
    #tarotApp .reveal-panel { flex-direction: column; }
    #tarotApp .reveal-card { width: 140px; }
  }
</style>
</head>
<body>

<div class="tarot-app" id="tarotApp">
  <header class="tarot-header">
    <h1>🔮 Tirada de las 3 Cartas</h1>
    <p class="subtitle">Concéntrate en tu pregunta y deja que tu intuición elija.</p>
  </header>

  <section class="mode-step" id="modeStep">
    <p class="step-intro">¿Cómo quieres hacer esta tirada?</p>
    <div class="mode-options">
      <button type="button" class="mode-card" data-mode="digital">
        <span class="mode-icon">🔮</span>
        <h3>Tirada digital</h3>
        <p>Baraja virtual mezclada al azar. Elige tus 3 cartas por intuición, aquí mismo.</p>
      </button>
      <button type="button" class="mode-card" data-mode="fisica">
        <span class="mode-icon">🃏</span>
        <h3>Tirada física</h3>
        <p>Ya tiraste las cartas reales sobre la mesa. Búscalas aquí una por una para registrar la lectura.</p>
      </button>
    </div>
  </section>

  <section class="question-step" id="questionStep" hidden>
    <button type="button" id="backToModeBtn" class="link-btn">‹ Cambiar modo</button>
    <label for="questionInput">¿Qué quieres consultarle al tarot?</label>
    <textarea id="questionInput" rows="2" placeholder="Ej: ¿Cómo va a evolucionar mi situación laboral?"></textarea>
    <button id="startBtn" class="btn-primary">Comenzar tirada</button>
  </section>

  <section class="shuffle-step" id="shuffleStep" hidden>
    <p class="step-intro">Mezcla tu mazo virtual antes de elegir tus cartas.</p>
    <div class="shuffle-deck" id="shuffleDeck">
      <div class="deck-card"></div>
      <div class="deck-card"></div>
      <div class="deck-card"></div>
      <div class="deck-card"></div>
      <div class="deck-card"></div>
    </div>
    <button type="button" id="shuffleBtn" class="btn-primary">🔀 Mezclar cartas</button>
  </section>

  <section class="spread" id="spreadSection" hidden>
    <div class="slot" data-pos="0">
      <span class="slot-label">⏳ Pasado</span>
      <div class="slot-visual"><div class="slot-placeholder">?</div></div>
      <div class="slot-name"></div>
      <button class="btn-secondary slot-btn" data-pos="0">Elegir carta</button>
    </div>
    <div class="slot" data-pos="1">
      <span class="slot-label">🌙 Presente</span>
      <div class="slot-visual"><div class="slot-placeholder">?</div></div>
      <div class="slot-name"></div>
      <button class="btn-secondary slot-btn" data-pos="1">Elegir carta</button>
    </div>
    <div class="slot" data-pos="2">
      <span class="slot-label">✨ Futuro</span>
      <div class="slot-visual"><div class="slot-placeholder">?</div></div>
      <div class="slot-name"></div>
      <button class="btn-secondary slot-btn" data-pos="2">Elegir carta</button>
    </div>
  </section>

  <section class="reading" id="readingSection" hidden>
    <h2>🔮 Tu lectura</h2>
    <div id="readingContent"></div>
    <div class="footer-actions">
      <button id="resetBtn" class="btn-secondary">Nueva tirada</button>
      <button id="changeModeBtn" class="btn-secondary">Cambiar modo</button>
    </div>
  </section>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <input type="text" id="cardSearch" class="card-search-input" placeholder="Buscar carta (ej. &quot;Rey de Copas&quot;, &quot;Torre&quot;)..." hidden />
      <div class="card-grid" id="cardGrid"></div>
      <div class="reveal-panel" id="revealPanel" hidden>
        <div class="reveal-card" id="revealCardVisual"></div>
        <div class="reveal-info">
          <h3 id="revealCardName"></h3>
          <div class="orientation-toggle" id="orientationToggle" hidden>
            <button type="button" class="orientation-btn active" data-val="false">Derecha</button>
            <button type="button" class="orientation-btn" data-val="true">Invertida</button>
          </div>
          <p id="revealCardOrientation"></p>
          <div class="reveal-actions">
            <button id="confirmCardBtn" class="btn-primary">Confirmar esta carta</button>
            <button id="pickAnotherBtn" class="btn-secondary">Elegir otra</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {

  var MAJOR_DATA = [
    ["el-loco", "0. El Loco", "0", "Nuevo comienzo, espontaneidad, fe ciega, viaje.", "Impulsividad, locura, riesgo tonto, miedo al cambio."],

    ["la-justicia", "XI. La Justicia", "XI", "Verdad, consecuencias, equilibrio, decisiones legales.", "Injusticia, evasión de responsabilidad, culpa."],
    ["el-colgado", "XII. El Colgado", "XII", "Pausa, rendirse para ganar, nueva perspectiva, sacrificio.", "Estancamiento, no aprender la lección, víctima."],
    ["la-muerte", "XIII. La Muerte", "XIII", "Transformación, dejar ir, final necesario, renacimiento.", "Resistencia al cambio, duelo estancado, no soltar el pasado."],
    ["la-templanza", "XIV. La Templanza", "XIV", "Equilibrio, paciencia, mezclar opuestos, salud, fluir.", "Desequilibrio, impaciencia, caos, no encontrar el punto medio."],
    ["el-diablo", "XV. El Diablo", "XV", "Ataduras, adicciones, obsesiones, materialismo, sombra.", "Romper ataduras, liberarse, superar las adicciones."],
    ["la-torre", "XVI. La Torre", "XVI", "Caos, derrumbe, revelación impactante, cambio brusco.", "Evitar el desastre, retrasar lo inevitable, miedo al cambio."],
    ["la-estrella", "XVII. La Estrella", "XVII", "Esperanza, sanación, inspiración, calma después de la tormenta.", "Desesperanza, falta de fe, bloqueo creativo."],
    ["la-luna", "XVIII. La Luna", "XVIII", "Ilusiones, miedos ocultos, confusión, el subconsciente.", "Engaño, ansiedad, ver la verdad oculta, miedo superado."],
    ["el-sol", "XIX. El Sol", "XIX", "Éxito, alegría, claridad, vitalidad, logro.", "Exceso de optimismo, retrasos, falta de vitalidad."],
    ["el-juicio", "XX. El Juicio", "XX", "Llamado interior, renacimiento, evaluar tu vida, perdón.", "Negar el llamado, autocrítica dura, miedo al cambio."],
    ["el-mundo", "XXI. El Mundo", "XXI", "Plenitud, culminación, viaje completado, sentirte completo.", "Sin finalizar, falta de logro, sentirte fuera de lugar."]
  ];

  function buildAllCards() {
    var cards = [];

    MAJOR_DATA.forEach(function (row) {
      cards.push({
        id: row[0], name: row[1], numeral: row[2], icon: "✨",
        arcanaType: "mayor", suit: null, number: null,
        up: row[3], rev: row[4]
      });
    });

    SUITS.forEach(function (suit) {
      NUMBERS.forEach(function (num) {
        cards.push({
          id: suit.key + "-" + num.key,
          name: num.label + " de " + suit.name,
          numeral: num.label, icon: suit.icon,
          arcanaType: "menor", suit: suit.key, number: num.key,
          up: num.upTag + ", en el terreno de " + suit.domainUp + ".",
          rev: num.revTag + ", en el terreno de " + suit.domainRev + "."
        });
      });
      COURT_FIGURES.forEach(function (figure) {
        cards.push({
          id: suit.key + "-" + figure.key,
          name: figure.name + " de " + suit.name,
          numeral: figure.name, icon: suit.icon,
          arcanaType: "corte", suit: suit.key, number: null,
          up: figure.upDesc + ", orientada hacia " + suit.domainUp + ".",
          rev: figure.revDesc + ", en el terreno de " + suit.domainRev + "."
        });
      });
    });

    return cards;
  }

  var ALL_CARDS = buildAllCards(); // 22 + 40 + 16 = 78, ya en orden lógico (mayores, luego cada palo)
  var CARDS_BY_ID = {};
  ALL_CARDS.forEach(function (c) { CARDS_BY_ID[c.id] = c; });

  var POSITIONS = [
    { label: "Pasado", icon: "⏳" },
    { label: "Presente", icon: "🌙" },
    { label: "Futuro", icon: "✨" }
  ];

  /* ===================== ESTADO ===================== */

  var state = {
    mode: null, // "digital" | "fisica"
    question: "",
    reversedMap: {},
    usedIds: {},
    picks: [null, null, null],
    currentPos: null,
    pendingCardId: null,
    pendingReversed: false
  };

  /* ===================== HELPERS DOM ===================== */

  var $ = function (id) { return document.getElementById(id); };
  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function cardFaceHTML(card, reversed) {
    return (
      '<div class="card-face arcana-' + card.arcanaType + (card.suit ? " suit-" + card.suit : "") + '">' +
        '<div class="card-inner' + (reversed ? " is-reversed" : "") + '">' +
          '<img class="card-photo" src="' + IMAGE_BASE_URL + card.id + '.png" alt="" onerror="this.style.display=\'none\'">' +
          '<div class="card-symbolic">' +
            '<span class="card-tag">' + escapeHtml(card.numeral || "") + '</span>' +
            '<span class="card-icon">' + card.icon + '</span>' +
            '<span class="card-name-mini">' + escapeHtml(card.name) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /* ===================== SELECCIÓN DE MODO ===================== */

  document.querySelectorAll(".mode-card").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.mode = btn.dataset.mode;
      $("modeStep").hidden = true;
      $("questionStep").hidden = false;
    });
  });

  $("backToModeBtn").addEventListener("click", function () {
    $("questionStep").hidden = true;
    $("modeStep").hidden = false;
  });

  $("changeModeBtn").addEventListener("click", function () {
    $("readingSection").hidden = true;
    $("spreadSection").hidden = true;
    $("shuffleStep").hidden = true;
    $("questionStep").hidden = true;
    $("modeStep").hidden = false;
  });

  /* ===================== FLUJO PRINCIPAL ===================== */

  function resetSlotsUI() {
    document.querySelectorAll("#tarotApp .slot").forEach(function (slot) {
      slot.querySelector(".slot-visual").innerHTML = '<div class="slot-placeholder">?</div>';
      slot.querySelector(".slot-name").textContent = "";
      var btn = slot.querySelector(".slot-btn");
      btn.disabled = false;
      btn.textContent = "Elegir carta";
    });
  }

  $("startBtn").addEventListener("click", function () {
    state.question = $("questionInput").value.trim();
    state.usedIds = {};
    state.picks = [null, null, null];
    resetSlotsUI();

    $("questionStep").hidden = true;
    $("readingSection").hidden = true;
    $("readingContent").innerHTML = "";

    if (state.mode === "digital") {
      state.reversedMap = {};
      ALL_CARDS.forEach(function (c) {
        state.reversedMap[c.id] = Math.random() < REVERSED_PROBABILITY;
      });
      $("shuffleDeck").classList.remove("is-shuffling");
      $("shuffleBtn").disabled = false;
      $("shuffleStep").hidden = false;
    } else {
      $("spreadSection").hidden = false;
    }
  });

  $("shuffleBtn").addEventListener("click", function () {
    $("shuffleBtn").disabled = true;
    $("shuffleDeck").classList.add("is-shuffling");
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(function () {
      $("shuffleDeck").classList.remove("is-shuffling");
      $("shuffleStep").hidden = true;
      $("spreadSection").hidden = false;
    }, reduced ? 150 : 950);
  });

  document.querySelectorAll(".slot-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openModal(parseInt(btn.dataset.pos, 10));
    });
  });

  $("resetBtn").addEventListener("click", function () {
    $("readingSection").hidden = true;
    $("spreadSection").hidden = true;
    $("shuffleStep").hidden = true;
    $("questionStep").hidden = false;
    $("questionInput").value = "";
  });

  /* ===================== MODAL DE SELECCIÓN ===================== */

  function openModal(posIndex) {
    state.currentPos = posIndex;
    state.pendingCardId = null;
    var verb = state.mode === "digital" ? "Elige tu carta para: " : "Busca la carta que salió para: ";
    $("modalTitle").textContent = verb + POSITIONS[posIndex].label;
    $("revealPanel").hidden = true;

    var searchInput = $("cardSearch");
    searchInput.hidden = state.mode !== "fisica";
    searchInput.value = "";
    $("cardGrid").classList.toggle("card-grid--browse", state.mode === "fisica");

    renderGrid("");
    $("modalOverlay").hidden = false;
    if (state.mode === "fisica") searchInput.focus();
  }

  function renderGrid(query) {
    var available = ALL_CARDS.filter(function (c) { return !state.usedIds[c.id]; });
    var list = state.mode === "digital" ? shuffle(available) : available.filter(function (c) {
      return !query || c.name.toLowerCase().indexOf(query.toLowerCase()) !== -1;
    });

    var grid = $("cardGrid");
    grid.innerHTML = "";

    if (state.mode === "fisica" && list.length === 0) {
      grid.innerHTML = '<p class="card-search-empty">Ninguna carta coincide con la búsqueda.</p>';
      return;
    }

    list.forEach(function (card) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.id = card.id;
      if (state.mode === "digital") {
        b.className = "card-mini-btn";
        b.setAttribute("aria-label", "Carta boca abajo");
      } else {
        b.className = "card-search-btn";
        b.innerHTML = cardFaceHTML(card, false);
      }
      b.addEventListener("click", function () { revealCard(card.id); });
      grid.appendChild(b);
    });
  }

  $("cardSearch").addEventListener("input", function (e) {
    renderGrid(e.target.value.trim());
  });

  function closeModal() {
    $("modalOverlay").hidden = true;
  }
  $("modalClose").addEventListener("click", closeModal);
  $("modalOverlay").addEventListener("click", function (e) {
    if (e.target === $("modalOverlay")) closeModal();
  });

  /* ===================== REVELACIÓN Y ORIENTACIÓN ===================== */

  function updateOrientationButtons() {
    document.querySelectorAll("#orientationToggle .orientation-btn").forEach(function (b) {
      var isRev = b.dataset.val === "true";
      b.classList.toggle("active", isRev === state.pendingReversed);
    });
  }

  function renderRevealVisual() {
    var card = CARDS_BY_ID[state.pendingCardId];
    $("revealCardVisual").innerHTML = cardFaceHTML(card, state.pendingReversed);
    $("revealCardName").textContent = card.name + (state.pendingReversed ? " (invertida)" : "");
    $("revealCardOrientation").textContent = state.pendingReversed ? card.rev : card.up;
  }

  function revealCard(cardId) {
    state.pendingCardId = cardId;
    state.pendingReversed = state.mode === "digital" ? !!state.reversedMap[cardId] : false;
    $("orientationToggle").hidden = state.mode !== "fisica";
    updateOrientationButtons();
    renderRevealVisual();
    $("revealPanel").hidden = false;
  }

  document.querySelectorAll("#orientationToggle .orientation-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.pendingReversed = btn.dataset.val === "true";
      updateOrientationButtons();
      renderRevealVisual();
    });
  });

  $("pickAnotherBtn").addEventListener("click", function () {
    $("revealPanel").hidden = true;
    state.pendingCardId = null;
    if (state.mode === "fisica") $("cardSearch").focus();
  });

  $("confirmCardBtn").addEventListener("click", function () {
    if (!state.pendingCardId) return;
    var card = CARDS_BY_ID[state.pendingCardId];
    state.usedIds[card.id] = true;
    state.picks[state.currentPos] = { card: card, reversed: state.pendingReversed };

    updateSlotUI(state.currentPos);
    closeModal();

    if (state.picks.every(function (p) { return p !== null; })) {
      renderReading();
    }
  });

  function updateSlotUI(posIndex) {
    var slot = document.querySelector('.slot[data-pos="' + posIndex + '"]');
    var pick = state.picks[posIndex];
    slot.querySelector(".slot-visual").innerHTML = cardFaceHTML(pick.card, pick.reversed);
    slot.querySelector(".slot-name").textContent = pick.card.name + (pick.reversed ? " (invertida)" : "");
    var btn = slot.querySelector(".slot-btn");
    btn.textContent = "✓ Elegida";
    btn.disabled = true;
  }

  /* ===================== MOTOR DE INTERPRETACIÓN ===================== */

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function inlinePhrase(str) {
    var s = str.trim();
    if (s.charAt(s.length - 1) === ".") s = s.slice(0, -1);
    return s.charAt(0).toLowerCase() + s.slice(1);
  }

  var OPENERS_WITH_Q = [
    'Sobre tu pregunta — "{q}" — esto es lo que revelan las cartas:',
    'Dejaste que tu intuición eligiera, y esto fue lo que salió para tu pregunta: "{q}".',
    'Las cartas ya hablaron. Esto es lo que tienen para decirte sobre "{q}":',
    'Con "{q}" en mente, así se despliega tu tirada:'
  ];
  var OPENERS_NO_Q = [
    "Esto es lo que revelan tus cartas:",
    "Así se despliega tu tirada:",
    "Las cartas ya hablaron, esto es lo que tienen para decirte:"
  ];

  var POSITION_INTROS = {
    "Pasado": ["Todo esto arranca con algo del pasado", "Ahí están las raíces de tu consulta", "Ese fue tu punto de partida"],
    "Presente": ["Así se ve tu momento actual", "Hoy estás atravesando esto", "El presente se resume en"],
    "Futuro": ["El camino apunta hacia esto", "Si seguís este rumbo, esto es lo que se perfila", "Hacia adelante, esto es lo que se asoma"]
  };

  var SYNTH_MAJORS_MANY = [
    function (n) { return "Hay " + n + " Arcanos Mayores en tu tirada: el tema que consultás es importante y trasciende lo cotidiano, probablemente forme parte de un aprendizaje o ciclo más grande de tu vida."; },
    function (n) { return "Con " + n + " Arcanos Mayores presentes, esto no es un tema menor — hay algo aquí que tiene peso en tu historia, no solo en tu semana."; }
  ];
  var SYNTH_MAJORS_NONE = [
    "No aparece ningún Arcano Mayor: esta tirada habla más de tu día a día y de decisiones concretas que de un destino ineludible, tenés bastante margen de acción.",
    "Sin Arcanos Mayores en juego, esto está más en tus manos de lo que parece: son decisiones cotidianas, no un mandato del destino."
  ];
  var SYNTH_SAME_SUIT = [
    function (suit) { return "Las tres cartas comparten el palo de " + suit.name + ", así que el foco real de esta situación está en " + suit.domainUp + "."; },
    function (suit) { return "Que las tres sean de " + suit.name + " no es casualidad: todo en esta tirada gira en torno a " + suit.domainUp + "."; }
  ];
  var SYNTH_REPEATED_NUMBER = [
    "Hay un número que se repite entre tus cartas: no es casualidad, es un tema que insiste y conviene prestarle atención.",
    "Un mismo número aparece más de una vez — cuando eso pasa, suele ser la vida subrayando algo que no podés seguir ignorando."
  ];
  var SYNTH_ALL_COURT = [
    "Las tres cartas son figuras de la Corte: esta situación gira mucho en torno a personas y a los roles o actitudes que tú u otros están representando, más que en hechos aislados.",
    "Al ser todas cartas de Corte, esto tiene mucho de vínculos y actitudes: mirá quién está jugando qué papel en esta historia."
  ];
  var SYNTH_REVERSED_NONE = [
    "Ninguna carta salió invertida: las energías de esta tirada fluyen sin grandes bloqueos.",
    "Todas tus cartas cayeron derechas: el camino está relativamente despejado."
  ];
  var SYNTH_REVERSED_ONE = [
    "Una de las tres cartas salió invertida: hay un punto concreto de fricción o resistencia que conviene vigilar.",
    "Con una carta invertida en la mezcla, hay un freno puntual: no es toda la tirada, pero merece atención."
  ];
  var SYNTH_REVERSED_MANY = [
    function (n) { return n + " de las tres cartas salieron invertidas: hay bastante resistencia o bloqueo en juego."; },
    function (n) { return "Con " + n + " cartas invertidas, esta tirada trae bastante fricción interna."; }
  ];
  var CLOSING_FLOWING = [
    "Es un buen momento para avanzar con confianza.",
    "Dejate llevar: por ahora, las señales acompañan."
  ];
  var CLOSING_BLOCKED = [
    "Antes de actuar, vale la pena hacer una pausa y mirar hacia adentro.",
    "No fuerces nada: hay algo que primero necesita resolverse internamente."
  ];

  function buildSynthesis(picks) {
    var sentences = [];
    var majors = picks.filter(function (p) { return p.card.arcanaType === "mayor"; }).length;
    var allCourt = picks.every(function (p) { return p.card.arcanaType === "corte"; });
    var reversedCount = picks.filter(function (p) { return p.reversed; }).length;
    var suitsPresent = picks.map(function (p) { return p.card.suit; }).filter(Boolean);
    var allSameSuit = suitsPresent.length === 3 && new Set(suitsPresent).size === 1;
    var numbersPresent = picks.map(function (p) { return p.card.number; }).filter(function (n) { return n; });
    var hasRepeatedNumber = numbersPresent.length >= 2 && new Set(numbersPresent).size < numbersPresent.length;

    if (majors >= 2) {
      sentences.push(pick(SYNTH_MAJORS_MANY)(majors));
    } else if (majors === 0) {
      sentences.push(pick(SYNTH_MAJORS_NONE));
    }

    if (allSameSuit) {
      var suit = SUITS.filter(function (s) { return s.key === suitsPresent[0]; })[0];
      sentences.push(pick(SYNTH_SAME_SUIT)(suit));
    }

    if (hasRepeatedNumber) {
      sentences.push(pick(SYNTH_REPEATED_NUMBER));
    }

    if (allCourt) {
      sentences.push(pick(SYNTH_ALL_COURT));
    }

    if (reversedCount === 0) {
      sentences.push(pick(SYNTH_REVERSED_NONE));
    } else if (reversedCount === 1) {
      sentences.push(pick(SYNTH_REVERSED_ONE));
    } else {
      sentences.push(pick(SYNTH_REVERSED_MANY)(reversedCount));
    }

    sentences.push(pick(reversedCount === 0 ? CLOSING_FLOWING : CLOSING_BLOCKED));

    return sentences.join(" ");
  }

  function renderReading() {
    var html = "";
    var opener = state.question
      ? pick(OPENERS_WITH_Q).replace("{q}", escapeHtml(state.question))
      : pick(OPENERS_NO_Q);
    html += '<p class="reading-question">' + opener + "</p>";

    state.picks.forEach(function (pick_, i) {
      var label = POSITIONS[i].label;
      var keywords = escapeHtml(inlinePhrase(pick_.reversed ? pick_.card.rev : pick_.card.up));
      var intro = pick(POSITION_INTROS[label]);
      html +=
        '<div class="reading-line">' +
          "<h3>" + POSITIONS[i].icon + " " + label + ": " + escapeHtml(pick_.card.name) + (pick_.reversed ? " (invertida)" : "") + "</h3>" +
          "<p>" + intro + ": " + keywords + ".</p>" +
        "</div>";
    });

    html +=
      '<div class="reading-synthesis">' +
        "<h3>🔮 Síntesis de la tirada</h3>" +
        "<p>" + buildSynthesis(state.picks) + "</p>" +
      "</div>";

    $("readingContent").innerHTML = html;
    $("readingSection").hidden = false;
    $("readingSection").scrollIntoView({ behavior: "smooth", block: "start" });
  }
})();
</script>

</body>
</html>
