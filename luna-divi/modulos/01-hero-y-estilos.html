<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dark:    #050810;
    --dark2:   #0d1224;
    --dark3:   #161d38;
    --acc:     #5b6af0;
    --acc2:    #7c8af7;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #f59e0b;
    --text:    #e2e8f0;
    --text2:   #94a3b8;
    --text3:   #64748b;
    --luna:    #5b6af0;
  }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--dark);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(135deg, #050810 0%, #0d1224 50%, #1a1060 100%);
    padding: 80px 24px 100px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(91,106,240,.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(91,106,240,.15);
    border: 1px solid rgba(91,106,240,.4);
    color: var(--acc2);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .hero h1 {
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 20px;
  }
  .hero h1 span { color: var(--acc2); }
  .hero p {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--text2);
    max-width: 640px;
    margin: 0 auto 40px;
  }
  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--acc);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 10px;
    text-decoration: none;
    transition: background .2s, transform .2s;
    box-shadow: 0 4px 24px rgba(91,106,240,.4);
  }
  .hero-cta:hover { background: var(--acc2); transform: translateY(-2px); }

  /* ── SECCIÓN ── */
  section { padding: 80px 24px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--acc2);
    margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 800;
    margin-bottom: 12px;
  }
  .section-sub {
    color: var(--text2);
    font-size: 1.05rem;
    margin-bottom: 48px;
    max-width: 600px;
  }

  /* ── PILLS DIFERENCIALES ── */
  .pills { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 64px; }
  .pill {
    background: var(--dark2);
    border: 1px solid var(--dark3);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

  /* ── CARDS DESTACADAS ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 64px;
  }
  .card {
    background: var(--dark2);
    border: 1px solid var(--dark3);
    border-radius: 16px;
    padding: 28px 24px;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: var(--acc); transform: translateY(-4px); }
  .card.highlight {
    background: linear-gradient(135deg, #0d1224, #1a1060);
    border-color: var(--acc);
    box-shadow: 0 0 32px rgba(91,106,240,.15);
  }
  .card-icon { font-size: 32px; margin-bottom: 16px; }
  .card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
  .card p { color: var(--text2); font-size: 13.5px; }

  /* ── TABLA COMPARATIVA ── */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 700px;
  }
  thead tr { background: var(--dark3); }
  thead th {
    padding: 16px 20px;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .5px;
  }
  thead th:first-child { text-align: left; }
  thead th.luna-col {
    background: linear-gradient(135deg, #1a1060, #0d1224);
    color: var(--acc2);
    border-top: 2px solid var(--acc);
    border-radius: 8px 8px 0 0;
  }
  tbody tr { border-bottom: 1px solid var(--dark3); transition: background .15s; }
  tbody tr:hover { background: rgba(255,255,255,.02); }
  tbody tr:last-child { border-bottom: none; }
  tbody td {
    padding: 14px 20px;
    text-align: center;
    color: var(--text2);
    font-size: 13.5px;
  }
  tbody td:first-child {
    text-align: left;
    color: var(--text);
    font-weight: 600;
  }
  td.luna-col {
    background: rgba(91,106,240,.06);
    border-left: 1px solid rgba(91,106,240,.2);
    border-right: 1px solid rgba(91,106,240,.2);
    color: var(--text) !important;
    font-weight: 600 !important;
  }
  td.luna-col.last { border-radius: 0 0 8px 8px; border-bottom: 2px solid var(--acc); }
  .yes { color: var(--green); font-size: 18px; }
  .no  { color: var(--red);   font-size: 18px; }
  .partial { color: var(--yellow); font-size: 13px; font-weight: 600; }
  .bold-green { color: var(--green); font-weight: 700; font-size: 14px; }

  /* ── PRECIO COMPARATIVO ── */
  .pricing-bg { background: var(--dark2); }
  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
  }
  .price-card {
    background: var(--dark);
    border: 1px solid var(--dark3);
    border-radius: 14px;
    padding: 24px 20px;
    text-align: center;
  }
  .price-card.luna-price {
    border-color: var(--acc);
    background: linear-gradient(135deg, #0d1224, #1a1060);
    box-shadow: 0 0 32px rgba(91,106,240,.2);
    transform: scale(1.05);
  }
  .price-card .brand { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
  .price-card.luna-price .brand { color: var(--acc2); }
  .price-card .amount {
    font-size: 2rem;
    font-weight: 900;
    color: var(--red);
    line-height: 1;
    margin-bottom: 4px;
  }
  .price-card.luna-price .amount { color: var(--green); }
  .price-card .period { font-size: 11px; color: var(--text3); margin-bottom: 12px; }
  .price-card .note { font-size: 12px; color: var(--text2); }
  .price-card .savings {
    display: inline-block;
    background: rgba(34,197,94,.12);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 8px;
  }
  .pricing-note {
    text-align: center;
    color: var(--text2);
    font-size: 13px;
    margin-top: 28px;
    padding: 16px;
    background: rgba(91,106,240,.08);
    border: 1px solid rgba(91,106,240,.2);
    border-radius: 10px;
  }
  .pricing-note strong { color: var(--text); }

  /* ── WA HIGHLIGHT ── */
  .wa-block {
    background: linear-gradient(135deg, #0a1f0a, #0d2a0d);
    border: 1px solid #22c55e44;
    border-radius: 20px;
    padding: 48px 40px;
    display: flex;
    gap: 40px;
    align-items: center;
    flex-wrap: wrap;
  }
  .wa-block .wa-icon { font-size: 72px; flex-shrink: 0; }
  .wa-block h2 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; margin-bottom: 12px; }
  .wa-block p { color: var(--text2); font-size: 15px; max-width: 520px; }
  .wa-badge {
    display: inline-block;
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.3);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  /* ── PLANES ── */
  .plans-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
  }
  .plan-card {
    background: var(--dark2);
    border: 1px solid var(--dark3);
    border-radius: 16px;
    padding: 28px 22px;
    position: relative;
    overflow: hidden;
  }
  .plan-card.popular {
    border-color: var(--acc);
    box-shadow: 0 0 32px rgba(91,106,240,.15);
  }
  .plan-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--acc);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .plan-name { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
  .plan-price {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .plan-price span { font-size: 14px; font-weight: 400; color: var(--text3); }
  .plan-users { font-size: 13px; color: var(--text2); margin: 12px 0 16px; }
  .plan-features { list-style: none; }
  .plan-features li {
    font-size: 13px;
    color: var(--text2);
    padding: 5px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .plan-features li::before { content: '✓'; color: var(--green); font-weight: 700; flex-shrink: 0; }
  .plan-cta {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid var(--acc);
    background: transparent;
    color: var(--acc2);
    font-family: inherit;
    transition: background .2s, color .2s, transform .15s;
  }
  .plan-cta:hover { background: var(--acc); color: #fff; transform: translateY(-1px); }
  .plan-card.popular .plan-cta { background: var(--acc); color: #fff; }
  .plan-card.popular .plan-cta:hover { background: var(--acc2); }

  /* ── DATA PRIVACY ── */
  .privacy-block {
    background: linear-gradient(135deg, #0a0a1f, #0d0d2a);
    border: 1px solid rgba(91,106,240,.3);
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
  }
  .privacy-block h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; margin-bottom: 16px; }
  .privacy-block p { color: var(--text2); font-size: 15px; max-width: 600px; margin: 0 auto 28px; }
  .privacy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 32px;
    text-align: left;
  }
  .privacy-item {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 20px 18px;
  }
  .privacy-item .icon { font-size: 24px; margin-bottom: 10px; }
  .privacy-item h4 { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .privacy-item p { font-size: 12.5px; color: var(--text3); margin: 0; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,8,16,.85);
    backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--dark2);
    border: 1px solid rgba(91,106,240,.3);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
    position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
    animation: modal-in .25s ease;
  }
  @keyframes modal-in {
    from { opacity:0; transform:translateY(20px) scale(.97); }
    to   { opacity:1; transform:translateY(0)  scale(1); }
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 20px;
    background: none;
    border: none;
    color: var(--text3);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    transition: color .2s;
  }
  .modal-close:hover { color: var(--text); }
  .modal h3 {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .modal-sub {
    color: var(--text2);
    font-size: 0.88rem;
    margin-bottom: 28px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    background: var(--dark3);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color .2s;
  }
  .form-group input:focus,
  .form-group select:focus { border-color: var(--acc); }
  .form-group input::placeholder { color: var(--text3); }
  .phone-row {
    display: flex;
    gap: 8px;
  }
  .phone-row select { width: 160px; flex-shrink: 0; }
  .phone-row input  { flex: 1; }
  .form-group select option { background: #1a2040; }
  .modal-submit {
    width: 100%;
    margin-top: 8px;
    background: var(--acc);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
    transition: background .2s, transform .2s;
    box-shadow: 0 4px 20px rgba(91,106,240,.4);
  }
  .modal-submit:hover:not(:disabled) { background: var(--acc2); transform: translateY(-1px); }
  .modal-submit:disabled { opacity: .6; cursor: default; }
  .modal-msg {
    margin-top: 14px;
    font-size: 0.88rem;
    text-align: center;
    min-height: 20px;
  }
  .modal-msg.ok  { color: var(--green); }
  .modal-msg.err { color: var(--red); }

  /* plan selector */
  .plan-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .plan-btn {
    background: var(--dark3);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px;
    color: var(--text2);
    cursor: pointer;
    padding: 10px 8px;
    text-align: center;
    transition: border-color .2s, background .2s, color .2s;
    font-size: 0.82rem;
    font-family: inherit;
  }
  .plan-btn strong { display: block; font-size: 0.95rem; color: var(--text); margin-bottom: 2px; }
  .plan-btn .plan-price { font-size: 0.78rem; color: var(--text3); }
  .plan-btn:hover { border-color: var(--acc); }
  .plan-btn.selected {
    border-color: var(--acc);
    background: rgba(91,106,240,.15);
    color: var(--text);
  }
  .plan-btn.selected .plan-price { color: var(--acc2); }
  .phone-hint { font-size: 0.75rem; color: var(--text3); margin-top: 4px; }

  /* ── CTA FINAL ── */
  .cta-section {
    text-align: center;
    padding: 100px 24px;
    background: linear-gradient(180deg, var(--dark) 0%, #0d0d2a 100%);
  }
  .cta-section h2 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 16px; }
  .cta-section p { color: var(--text2); font-size: 1.1rem; margin-bottom: 40px; }
  .cta-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--acc);
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 4px 24px rgba(91,106,240,.4);
    transition: background .2s, transform .2s;
  }
  .btn-primary:hover { background: var(--acc2); transform: translateY(-2px); }
  .btn-ghost {
    background: transparent;
    color: var(--text2);
    font-weight: 600;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 10px;
    text-decoration: none;
    border: 1px solid var(--dark3);
    transition: border-color .2s, color .2s;
  }
  .btn-ghost:hover { border-color: var(--acc); color: var(--text); }

  /* ── FOOTER ── */
  footer {
    background: var(--dark2);
    border-top: 1px solid var(--dark3);
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: var(--text3);
  }
  footer a { color: var(--text2); text-decoration: none; }
  footer a:hover { color: var(--text); }

  /* ── DIVIDER ── */
  .divider { border: none; border-top: 1px solid var(--dark3); margin: 0; }

  /* ── LABEL LUNA EN TABLA ── */
  .luna-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(91,106,240,.15);
    border: 1px solid rgba(91,106,240,.35);
    color: var(--acc2);
    font-size: 12px;
    font-weight: 800;
    padding: 3px 12px;
    border-radius: 999px;
  }
</style>
