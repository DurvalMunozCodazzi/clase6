<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva Total</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <h1 class="brand">🏨 Reserva Total</h1>
        <nav class="nav">
          <button class="nav-link active" data-view="rooms">Habitaciones</button>
          <button class="nav-link" data-view="my-reservations">Mis reservas</button>
        </nav>
      </div>
    </header>

    <main class="container">
      <div id="toast" class="toast hidden"></div>

      <!-- Vista: Habitaciones -->
      <section id="view-rooms" class="view">
        <section class="search-card">
          <h2>Buscar disponibilidad</h2>
          <form id="search-form" class="search-form">
            <div class="field">
              <label for="checkIn">Entrada</label>
              <input type="date" id="checkIn" name="checkIn" required />
            </div>
            <div class="field">
              <label for="checkOut">Salida</label>
              <input type="date" id="checkOut" name="checkOut" required />
            </div>
            <div class="field">
              <label for="guests">Huéspedes</label>
              <input type="number" id="guests" name="guests" min="1" value="1" required />
            </div>
            <button type="submit" class="btn btn-primary">Buscar</button>
          </form>
        </section>

        <section id="rooms-grid" class="rooms-grid">
          <p class="empty-state">Cargando habitaciones...</p>
        </section>
      </section>

      <!-- Vista: Mis reservas -->
      <section id="view-my-reservations" class="view hidden">
        <section class="search-card">
          <h2>Mis reservas</h2>
          <form id="my-reservations-form" class="search-form">
            <div class="field">
              <label for="lookupEmail">Tu email</label>
              <input type="email" id="lookupEmail" name="lookupEmail" placeholder="nombre@correo.com" required />
            </div>
            <button type="submit" class="btn btn-primary">Buscar reservas</button>
          </form>
        </section>
        <section id="reservations-list" class="reservations-list"></section>
      </section>
    </main>

    <!-- Modal de reserva -->
    <div id="reservation-modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close" id="modal-close">&times;</button>
        <h2>Confirmar reserva</h2>
        <p id="modal-room-summary" class="modal-summary"></p>
        <form id="reservation-form">
          <input type="hidden" id="modalRoomId" name="roomId" />
          <div class="field">
            <label for="guestName">Nombre completo</label>
            <input type="text" id="guestName" name="guestName" required />
          </div>
          <div class="field">
            <label for="guestEmail">Email</label>
            <input type="email" id="guestEmail" name="guestEmail" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Confirmar reserva</button>
        </form>
      </div>
    </div>

    <footer class="footer">Reserva Total — Sistema de reservas de habitaciones</footer>

    <script src="app.js"></script>
  </body>
</html>
