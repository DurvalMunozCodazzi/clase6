<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>YouTube a Texto</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 40px 20px; color: #222; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    input[type=text] { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    details { margin-top: 12px; }
    label { display: block; margin-top: 8px; font-size: 0.9rem; }
    #loading { display: none; margin-top: 16px; color: #555; }
    .saved { color: #1a7f37; margin-top: 20px; }
    textarea { width: 100%; height: 60vh; margin-top: 8px; padding: 10px; font-size: 0.95rem; box-sizing: border-box; }
    .error { color: #b00020; margin-top: 12px; }
    .button-like { display: inline-block; margin-top: 12px; padding: 8px 16px; background: #222; color: #fff; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>YouTube a Texto</h1>
    <form id="form" action="/transcribir" method="post">
      <input type="text" name="url" placeholder="Pegá el link del video de YouTube" required autofocus>
      <details>
        <summary>Opciones avanzadas</summary>
        <label>Idioma (ej: es, en; vacío = detectar solo)
          <input type="text" name="language" value="es">
        </label>
        <label>Modelo Whisper
          <select name="model">
            <option value="tiny">tiny (rápido, menos preciso)</option>
            <option value="base" selected>base</option>
            <option value="small">small</option>
            <option value="medium">medium (lento, más preciso)</option>
          </select>
        </label>
      </details>
      <button type="submit">Transcribir</button>
    </form>

    <div id="loading">Descargando y transcribiendo, puede tardar unos minutos...</div>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    {% if text %}
      <p class="saved">Guardado en: {{ saved_path }}</p>
      <a href="/" class="button-like">↩ Nueva transcripción</a>
      <button type="button" id="copyBtn" class="button-like" style="background:#1a7f37;border:none;">📋 Copiar transcripción</button>
    {% endif %}
  </div>

  {% if text %}
    <textarea id="transcriptText" readonly>{{ text }}</textarea>
  {% endif %}

  <script>
    document.getElementById("form").addEventListener("submit", function () {
      document.getElementById("loading").style.display = "block";
    });

    var copyBtn = document.getElementById("copyBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        var text = document.getElementById("transcriptText").value;
        navigator.clipboard.writeText(text).then(function () {
          copyBtn.textContent = "✅ Copiado";
          setTimeout(function () { copyBtn.textContent = "📋 Copiar transcripción"; }, 2000);
        });
      });
    }
  </script>
</body>
</html>
