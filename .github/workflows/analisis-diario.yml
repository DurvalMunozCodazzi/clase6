# Para correrlo online gratis con GitHub Actions:
# 1. Copia este archivo a .github/workflows/analisis-diario.yml (en la raiz del repo)
# 2. En GitHub: Settings > Secrets and variables > Actions > New repository secret
#    Nombre: ANTHROPIC_API_KEY, Valor: tu clave de console.anthropic.com
# 3. Corre todos los dias habiles a las 18:30 hora Argentina (21:30 UTC)
#    y guarda el informe como commit en el repo.

name: Analisis diario de cartera

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analizador-cartera/requirements.txt
      - run: python analizador-cartera/analizador.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar informe en el repo
        run: |
          git config user.name "analizador-cartera"
          git config user.email "actions@github.com"
          git add analizador-cartera/informes analizador-cartera/historial
          git diff --cached --quiet || git commit -m "Informe diario $(date -u +%F)"
          git push
